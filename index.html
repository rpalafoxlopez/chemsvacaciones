<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Modo Vacaciones Activado</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "#131313",
                        "surface-card": "#1c1b1b",
                        "primary": "#d4af37",
                        "primary-hover": "#f1e5c2",
                        "on-surface": "#e4e2e2",
                        "on-surface-muted": "#a8a5a5",
                        "outline": "#353434"
                    },
                    fontFamily: {
                        'serif': ['"Libre Caslon Text"', 'serif'],
                        'sans': ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .gold-glow {
            box-shadow: 0 10px 40px -10px rgba(1, 24, 68, 0.15);
        }
        .text-gradient {
            background: linear-gradient(45deg,  rgba(255,255,255,1) 0%,rgba(241,241,241,1) 50%,rgba(225,225,225,1) 51%,rgba(246,246,246,1) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-4 md:p-8 font-sans selection:bg-primary selection:text-black">

    <main class="w-full max-w-[540px] mx-auto relative">
        <!-- Glow Effect Background -->
        <div class="absolute -top-12 -left-12 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -right-12 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Vacation Card -->
        <article class="bg-surface-card rounded-2xl border border-outline gold-glow overflow-hidden backdrop-blur-sm transition-all duration-300">
            
            <!-- Hero Image Header -->
            <div class="h-64 sm:h-72 w-full relative overflow-hidden group">
                <img class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-700 ease-out" 
                     alt="Cheems descansando en la playa" 
                     src="https://lh3.googleusercontent.com/aida-public/AB6AXuBdMpJy-pia1lz76qOVlXpWstQc2sjSt98l6jYDa5KBoM5P6hOcnCNYkAA_9Z_qfoFwgWi6B9cjRfwB1t5RgwiM9hhgAx6TgpumZW11-HniwsAJ1MkL3_ejFlx0P8rMGps_Df0E_Mjq00FV8-ERNpSoSbU1CHVc2b34nuzqHdmY0U3onmPMxgU333ew9dELbLZ7ffYGnzSSOARrqfa6iEyh9PNMo6S7M7Of6KX9WhAzDoBD13dyvbKyaA"/>
                
                <!-- Overlay Gradient -->
                <div class="absolute inset-0 bg-gradient-to-t from-surface-card via-surface-card/20 to-transparent"></div>

            </div>

            <!-- Content Area -->
            <div class="p-6 sm:p-8 flex flex-col items-center text-center gap-6 relative -mt-6">
                
                <!-- Main Headline -->
                <h1 class="font-serif font-bold text-2xl sm:text-3xl text-gradient leading-tight tracking-tight">
                    ME FUI DE VACACIONES,<br/>NO ME LLAMEN
                </h1>

                <!-- Body Text -->
                <div class="space-y-4 w-full">
                    <p class="text-base sm:text-lg">
                        No me escriban a menos que sea para un buen <span class="text-primary font-bold underline decoration-primary/40 underline-offset-4">chisme</span>.
                    </p>
                    
                    <div class="py-2 px-4 rounded-xl bg-surface/50 border border-outline/50 backdrop-blur-sm inline-block">
                        <p class="text-lg font-bold text-primary">
                            Cualquier cosa que se complique... ¡Ustedes pueden, échenle ganas!
                        </p>
                    </div>

                    <p class="text-sm text-on-surface-muted italic">
                        <h3>
                            Los quiero <i>(no a todos, <b>como a 5</b>)</i> y los voy a extrañar <i>(no a todos, <b>como a 5</b>)</i>. 
                            Descansen en paz.
                        </h3>
                    </p>
                </div>

                <!-- Divider -->
                <div class="w-full border-t border-outline/60 my-1"></div>

                <!-- Footer Note & Cookie Button Section -->
                <div class="w-full flex flex-col items-center gap-4">
                    <p class="text-sm font-medium text-on-surface-muted">
                       <h1> 
                         Si me necesitan... <span class="text-on-surface font-semibold">desnecesítenme.</span>
                       </h1>
                    </p>

                    <!-- Interactive Cookie Button -->
                    <button id="cookie-btn" onclick="getFortune()" class="w-full sm:w-auto  border border-primary/80 hover:text-primary hover:bg-transparent bg-primary text-black font-semibold py-3 px-6 rounded-xl shadow-lg transition-all duration-300 flex items-center justify-center gap-2 group active:scale-95">
                        <span>🥠 ¿Quieres una galleta de la suerte?</span>
                    </button>

                    <!-- Fortune Display Box -->
                    <div id="fortune-box" class="hidden w-full mt-2 p-4 rounded-xl bg-primary/10 border border-primary/30 text-primary text-sm font-serif italic transition-all duration-500">
                        <!-- Content inserted via JS -->
                    </div>
                </div>

            </div>
        </article>
    </main>

    <!-- JavaScript for Fortune Cookie -->
    <script>
        const fortunes = [
            "“El trabajo puede esperar, el descanso no.”",
            "“La respuesta a tu problema de hoy es: resuélvelo el lunes.”",
            "“Hoy es un excelente día para apagar las notificaciones.”",
            "“Tu futuro dice que te hará bien no revisar el correo laboral.”",
            "“Error 404: Disponibilidad no encontrada.”"
        ];

        function getFortune() {
            location.href = "./suerte.html";
        }
    </script>
</body>
</html>
